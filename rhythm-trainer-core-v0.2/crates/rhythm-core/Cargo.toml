[package]
name = "rhythm-core"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Deterministic rhythm-training engine; no runtime dependencies"

[lib]
name = "rhythm_core"
path = "src/lib.rs"

[dependencies]
unicode-normalization = "0.1.26"
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
