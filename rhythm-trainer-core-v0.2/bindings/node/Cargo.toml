[package]
name = "rhythm-trainer-native"
version = "0.5.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
rhythm-core = { path = "../../crates/rhythm-core" }
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
